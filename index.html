<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>順勢療法 AI 智能助手 (二合一)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai@1.3.0"
      }
    }
    </script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .tab-active { border-bottom: 4px solid #0d9488; color: #0d9488; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>
    <div id="app">
        <nav class="bg-white shadow-md no-print sticky top-0 z-50">
            <div class="max-w-4xl mx-auto flex justify-around">
                <button id="btn-const" class="flex-1 py-4 font-bold transition-all tab-active">
                    <i class="fas fa-user-md mr-2"></i>體質搜尋器
                </button>
                <button id="btn-aid" class="flex-1 py-4 font-bold text-slate-500 hover:text-teal-600 transition-all">
                    <i class="fas fa-bolt mr-2"></i>急救小幫手
                </button>
            </div>
        </nav>

        <div id="api-setup" class="max-w-2xl mx-auto mt-10 p-6 bg-white rounded-2xl shadow-xl">
            <h2 class="text-xl font-bold mb-4 text-slate-800">請輸入您的 Gemini API Key</h2>
            <input type="password" id="api-key-input" placeholder="貼上您的 API Key..." class="w-full p-3 border rounded-lg mb-4">
            <button onclick="saveApiKey()" class="w-full bg-teal-600 text-white py-2 rounded-lg font-bold">儲存並開始</button>
            <p class="text-xs text-slate-400 mt-2 italic">Key 會儲存在瀏覽器中，不會上傳至其他伺服器。</p>
        </div>

        <div id="main-content" class="hidden max-w-2xl mx-auto py-10 px-4">
            <div id="app-container">
                <div class="text-center py-20">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-teal-600 mx-auto"></div>
                    <p class="mt-4 text-slate-600">載入組件中...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/genai";

        // 全域變數控製切換
        let currentMode = 'constitution';
        let apiKey = localStorage.getItem('gemini_api_key');

        window.saveApiKey = () => {
            const val = document.getElementById('api-key-input').value;
            if (val) {
                localStorage.setItem('gemini_api_key', val);
                location.reload();
            }
        };

        if (apiKey) {
            document.getElementById('api-setup').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            renderApp();
        }

        // 切換按鈕事件
        document.getElementById('btn-const').onclick = () => switchMode('constitution');
        document.getElementById('btn-aid').onclick = () => switchMode('firstaid');

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-const').className = mode === 'constitution' ? 'flex-1 py-4 font-bold tab-active' : 'flex-1 py-4 font-bold text-slate-500';
            document.getElementById('btn-aid').className = mode === 'firstaid' ? 'flex-1 py-4 font-bold tab-active' : 'flex-1 py-4 font-bold text-slate-500';
            renderApp();
        }

        function renderApp() {
            const container = document.getElementById('app-container');
            if (currentMode === 'constitution') {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
                        <header class="bg-teal-600 p-6 text-white text-center">
                            <h1 class="text-2xl font-bold">個人體質療劑搜尋器</h1>
                            <p class="opacity-80">深度全人健康分析</p>
                        </header>
                        <div class="p-8 space-y-6">
                            <p class="text-slate-600">這是一個針對長期體質的分析工具。請描述您的睡眠、情緒、家族史等...</p>
                            <textarea id="input-data" rows="6" class="w-full p-4 border rounded-xl focus:ring-2 focus:ring-teal-500 outline-none" placeholder="請輸入詳細情況..."></textarea>
                            <button onclick="runAnalysis()" class="w-full bg-teal-600 text-white py-4 rounded-xl font-bold shadow-lg">開始 AI 深度分析</button>
                        </div>
                    </div>`;
            } else {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border-t-4 border-orange-400">
                        <header class="bg-slate-800 p-6 text-white text-center">
                            <h1 class="text-2xl font-bold">急救療劑小幫手</h1>
                            <p class="opacity-80">急性症狀快速建議</p>
                        </header>
                        <div class="p-8 space-y-6">
                            <p class="text-slate-600">針對突然發生的狀況（如感冒、受傷）。請描述目前最不舒服的地方：</p>
                            <textarea id="input-data" rows="6" class="w-full p-4 border rounded-xl focus:ring-2 focus:ring-orange-400 outline-none" placeholder="例如：突然發燒、喉嚨像火燒..."></textarea>
                            <button onclick="runAnalysis()" class="w-full bg-orange-500 text-white py-4 rounded-xl font-bold shadow-lg">獲取急救建議</button>
                        </div>
                    </div>`;
            }
        }

        window.runAnalysis = async () => {
            const input = document.getElementById('input-data').value;
            if (!input) return alert("請輸入症狀");
            
            const container = document.getElementById('app-container');
            container.innerHTML = '<div class="text-center py-20"><p class="animate-bounce">AI 正在分析中，請稍候...</p></div>';

            try {
                const genAI = new GoogleGenerativeAI(apiKey);
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                
                const prompt = currentMode === 'constitution' 
                    ? `你是一位專業順勢療法專家。請根據以下體質描述給出建議：${input}`
                    : `你是一位專業順勢專家。請根據以下急性症狀給出急救療劑建議：${input}`;

                const result = await model.generateContent(prompt);
                const response = await result.response;
                const text = response.text();

                container.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl shadow-xl">
                        <h2 class="text-xl font-bold mb-4 text-teal-700">分析報告</h2>
                        <div class="prose max-w-none text-slate-700 whitespace-pre-wrap">${text}</div>
                        <button onclick="renderApp()" class="mt-8 w-full bg-slate-100 py-3 rounded-xl font-bold">返回重新輸入</button>
                    </div>`;
            } catch (err) {
                alert("發生錯誤：" + err.message);
                renderApp();
            }
        };
    </script>
</body>
</html>
